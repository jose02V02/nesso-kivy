name: Build Nesso APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip autoconf automake \
            libtool libltdl-dev pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev patch
          python -m pip install "pip==24.3.1"
          python -m pip install \
            "buildozer==1.5.0" "Cython==0.29.37" \
            "setuptools<70" wheel "virtualenv==20.26.6"

      - name: Configure Android build
        run: |
          python - <<'PY'
          from configparser import ConfigParser
          from pathlib import Path

          path = Path("buildozer.spec")
          config = ConfigParser(interpolation=None)
          config.read(path)
          app = config["app"]

          for key in (
              "android.sdk_path", "android.ndk_path",
              "android.ant_path", "p4a.source_dir",
              "p4a.local_recipes", "p4a.extra_args",
          ):
              app.pop(key, None)

          app["requirements"] = "python3==3.11.5,hostpython3==3.11.5,kivy==2.3.0"
          app["p4a.commit"] = "957a3e5f8c270f7aa648ba185e5a68c1077a798d"
          app["android.api"] = "33"
          app["android.minapi"] = "24"
          app["android.ndk_api"] = "24"
          app["android.ndk"] = "25b"
          app["android.accept_sdk_license"] = "True"

          excluded = app.get("source.exclude_dirs", "").split(",")
          excluded += [
              ".git", ".github", ".buildozer", ".host-tools",
              "nesso-env", "p4a-local", "bin",
          ]
          app["source.exclude_dirs"] = ",".join(
              dict.fromkeys(x.strip() for x in excluded if x.strip())
          )

          with path.open("w") as output:
              config.write(output)
          print(path.read_text())
          PY

      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build-github.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nesso-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nesso-build-log
          path: build-github.log
          if-no-files-found: ignore
